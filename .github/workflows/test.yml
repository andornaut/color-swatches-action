name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by the release workflow, so that nothing is published that this has
  # not passed. Workflows do not wait on each other, so a green Test run beside
  # a release says nothing about whether the release waited for it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Keyed by the calling workflow as well, so the run started by a push and the
# run the release workflow calls do not cancel each other.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The README links the example swatches, which this action generates from
      # the README itself and which are committed. Checked here rather than
      # regenerated by a workflow that commits: a push to main from a workflow
      # cannot satisfy the checks this branch requires, so the swatches arrive
      # with the change that moved them.
      #
      # Staged rather than diffed against the worktree, so a colour added to the
      # README counts: its swatch is a new file, and an unstaged diff does not
      # see one.
      - name: Check that the example swatches match the README
        run: |
          set -euo pipefail
          node color-swatches.mjs swatches README.md >/dev/null
          git add -A -- swatches/
          if ! git diff --cached --quiet -- swatches/; then
            echo "::error::swatches/ is out of date; run 'node color-swatches.mjs swatches README.md' and commit the result"
            git diff --cached --stat -- swatches/
            exit 1
          fi

      # The action installs the swatch generator through this script, so it is
      # as much of the shipped surface as the JavaScript beside it.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
