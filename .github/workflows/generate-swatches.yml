name: Generate example swatches

on:
  push:
    branches: [main]
    paths:
      - README.md
      - color-swatches.mjs
      - action.yml
  workflow_dispatch:

# Write access is granted only to the job that commits
permissions:
  contents: read

# One run at a time per branch. Spelled the same as every other workflow's
# group, though the pull request and fork terms are inert here: this one runs
# on main only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Generate swatches
        uses: ./
        with:
          files: "README.md"
          out-dir: "swatches"
